<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07070f">
<title>Free for Creators — license-verified free assets for creators</title>
<meta name="description" content="Interactive directory of free resources for video creators, streamers, podcasters, game devs and designers — filter by license, attribution and monetization. 许可透明的创作者免费素材清单。">
<link rel="canonical" href="https://skyzhao1223.github.io/free-for-creators/">
<meta property="og:title" content="Free for Creators — license-verified free assets">
<meta property="og:description" content="Interactive directory of 150+ free resources for creators — filter by license, attribution and monetization. 许可透明的创作者免费素材清单。">
<meta property="og:image" content="https://raw.githubusercontent.com/skyzhao1223/free-for-creators/main/assets/social-preview.png">
<meta property="og:url" content="https://skyzhao1223.github.io/free-for-creators/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="0.9em" font-size="90">🎁</text></svg>'>
<script>
  // Dark is the signature look; explicit user choice (toggle) is persisted.
  // Robust to blocked storage and works with JS disabled (html[data-theme=dark] default).
  (function () {
    var theme = "dark";
    try {
      var saved = localStorage.getItem("ffc-theme");
      if (saved === "light" || saved === "dark") theme = saved;
    } catch (e) {}
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
:root[data-theme="light"] {
  --bg: #f7f7fb; --fg: #1b1d26; --muted: #666b7c; --card: #ffffff;
  --border: #e5e7f0; --border-strong: #d2d5e2;
  --accent: #6d28d9; --accent-fg: #ffffff; --accent-soft: rgba(109,40,217,.08);
  --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  --grad-a: #4c1d95; --grad-b: #1d4ed8; --grad-c: #0891b2;
  --sticky-bg: rgba(247,247,251,.75);
  --blob-op: .13; --grid-op: .55; --noise-op: .025;
  --row-hover: rgba(109,40,217,.05);
  --shadow: 0 8px 24px rgba(30,20,60,.10);
}
:root[data-theme="dark"] {
  --bg: #07070f; --fg: #e8eaf6; --muted: #8b93b5; --card: rgba(255,255,255,.035);
  --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.16);
  --accent: #a78bfa; --accent-fg: #14101f; --accent-soft: rgba(167,139,250,.11);
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  --grad-a: #ffffff; --grad-b: #c4b5fd; --grad-c: #7dd3fc;
  --sticky-bg: rgba(7,7,15,.72);
  --blob-op: .42; --grid-op: 1; --noise-op: .05;
  --row-hover: rgba(167,139,250,.07);
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Noto Sans", "PingFang SC", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  line-height: 1.5; -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}
.mono { font-family: var(--mono); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
a { color: var(--accent); }
.grad {
  background: linear-gradient(92deg, var(--grad-a) 10%, var(--grad-b) 55%, var(--grad-c) 95%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- ambient background ---------- */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: var(--blob-op); transition: opacity .25s; will-change: transform; }
.b1 { width: 560px; height: 560px; left: -180px; top: -260px; background: #7c3aed; animation: drift1 26s ease-in-out infinite alternate; }
.b2 { width: 500px; height: 500px; right: -180px; top: -180px; background: #0ea5e9; animation: drift2 32s ease-in-out infinite alternate; }
.b3 { width: 420px; height: 420px; left: 40%; top: 300px; background: #ec4899; opacity: calc(var(--blob-op) * .5); animation: drift3 22s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(70px,50px) scale(1.15); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,70px) scale(1.08); } }
@keyframes drift3 { from { transform: translate(0,0); } to { transform: translate(50px,-60px); } }
.bg .gridlines {
  position: absolute; inset: 0; opacity: var(--grid-op);
  background-image: linear-gradient(rgba(127,127,180,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(127,127,180,.05) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse 110% 60% at 50% 0%, black 20%, transparent 85%);
  mask-image: radial-gradient(ellipse 110% 60% at 50% 0%, black 20%, transparent 85%);
}
.bg .noise {
  position: absolute; inset: 0; opacity: var(--noise-op);
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
}
@media (prefers-reduced-motion: reduce) {
  .b1, .b2, .b3 { animation: none; }
  .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  .dbar { animation: none; }
}

/* ---------- top bar ---------- */
.topbar { border-bottom: 1px solid var(--border); }
.tb { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 20px; flex-wrap: wrap; }
.tb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo-emoji { font-size: 23px; filter: drop-shadow(0 0 14px rgba(167,139,250,.4)); }
.wordmark { font-size: 17.5px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; }
.tagline { font-size: 11px; color: var(--muted); max-width: 520px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stats { font-size: 10.5px; color: var(--muted); letter-spacing: .03em; margin-right: 4px; white-space: nowrap; }
.stats b { color: var(--ok); font-weight: 600; }
.ib {
  color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: var(--card); border-radius: 7px;
  padding: 4px 10px; font-family: inherit; cursor: pointer; white-space: nowrap;
  transition: border-color .15s, color .15s;
}
.ib:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- sticky controls ---------- */
.controls-wrap {
  position: sticky; top: 0; z-index: 50;
  background: transparent;
  border-bottom: 1px solid transparent;
  padding: 10px 0 9px;
  transition: background-color .22s ease, border-color .22s ease;
}
.controls-wrap.stuck {
  background: var(--sticky-bg);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-bottom-color: var(--border);
}
#ctl-sentinel { height: 1px; margin-top: -1px; }
.ctl-row { display: flex; gap: 8px; align-items: center; }
.search-box {
  display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0;
  background: var(--card); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 0 12px; transition: border-color .15s, box-shadow .15s;
}
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-box svg { flex: none; width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2; }
#search { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font-size: 13.5px; padding: 8.5px 0; font-family: inherit; }
#search::placeholder { color: var(--muted); }
kbd {
  flex: none; font-family: var(--mono); font-size: 10px; color: var(--muted);
  border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px;
  padding: 1px 5px; background: var(--bg); white-space: nowrap;
}
.search-box:focus-within kbd.k-slash { opacity: 0; }
.vbtns { display: flex; border: 1px solid var(--border-strong); border-radius: 9px; overflow: hidden; background: var(--card); }
.vbtn { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 7.5px 10px; font-family: inherit; line-height: 1; }
.vbtn.active { background: var(--accent); color: var(--accent-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 130px; opacity: 1; overflow: hidden; transition: max-height .22s ease, opacity .16s ease, margin-top .22s ease; }
.chips.chips-hidden { max-height: 0; opacity: 0; margin-top: 0; pointer-events: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--card); color: var(--fg);
  border-radius: 7px; padding: 3px 9px; font-size: 11.5px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: border-color .15s, background .15s;
}
.chip:hover { border-color: var(--accent); }
.chip i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.chip .n { opacity: .6; font-size: 10px; font-weight: 500; font-family: var(--mono); }
.chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip.active .n { opacity: .85; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.tgl { position: relative; }
.tgl input { position: absolute; opacity: 0; pointer-events: none; }
.tgl span {
  display: inline-block; border: 1px solid var(--border); background: var(--card);
  color: var(--muted); border-radius: 7px; padding: 3px 9px;
  font-size: 11px; font-weight: 600; cursor: pointer; user-select: none; transition: all .15s;
}
.tgl span:hover { border-color: var(--accent); color: var(--fg); }
.tgl input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tgl input:focus-visible + span { box-shadow: 0 0 0 3px var(--accent-soft); }
.sortsel {
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  border-radius: 7px; padding: 3px 8px; font-size: 11px; font-weight: 600;
  font-family: var(--mono); cursor: pointer; outline: none;
}
#clear {
  border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 600;
  cursor: pointer; font-family: inherit; padding: 3px 8px; border-radius: 7px;
  text-decoration: underline; text-underline-offset: 3px;
}
#clear:hover { color: var(--bad); }

/* ---------- bento category wall ---------- */
#bento { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
.tile {
  position: relative; overflow: hidden; text-align: left;
  border: 1px solid var(--border); background: var(--card); border-radius: 11px;
  padding: 10px 12px 9px; cursor: pointer; font-family: inherit;
  transition: transform .15s, border-color .15s, background .15s;
}
.tile:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c) 55%, var(--border)); }
.tile.active { border-color: var(--c); background: color-mix(in srgb, var(--c) 9%, var(--card)); }
.tile-n { display: block; font-family: var(--mono); font-size: 19px; font-weight: 700; line-height: 1.15; color: var(--c); letter-spacing: -.02em; }
.tile-n small { font-size: 10.5px; opacity: .55; font-weight: 500; }
.tile-name { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile:hover .tile-name { color: var(--fg); }
.tile-glow { position: absolute; right: -22px; top: -22px; width: 76px; height: 76px; border-radius: 50%; background: var(--c); filter: blur(24px); opacity: .2; pointer-events: none; transition: opacity .2s; }
.tile:hover .tile-glow { opacity: .45; }
@media (max-width: 980px) { #bento { grid-template-columns: repeat(3, 1fr); } }

/* ---------- spotlight (Linear-style cursor glow border) ---------- */
.spot::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
  background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 65%, transparent), transparent 60%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.spot:hover::before { opacity: 1; }

/* ---------- reveal ---------- */
.reveal { opacity: 0; transform: translateY(12px); transition: opacity .55s ease, transform .55s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ---------- resource logos ---------- */
.logo {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 5px; flex: none; overflow: hidden;
  background: color-mix(in srgb, var(--c) 16%, transparent);
}
.logo b { font-size: 10px; font-weight: 700; line-height: 1; color: var(--c); }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.logo-sm { width: 16px; height: 16px; border-radius: 4px; }
.logo-sm b { font-size: 8.5px; }

/* ---------- status strip + data bar ---------- */
#status {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  margin: 13px 2px 2px; letter-spacing: .02em;
}
#status b { color: var(--fg); font-weight: 700; }
.dbar { display: inline-flex; width: 150px; height: 6px; border-radius: 99px; overflow: hidden; background: var(--border); flex: none; transform-origin: left; animation: barin .8s cubic-bezier(.2,.7,.3,1); }
.dbar i { height: 100%; min-width: 2px; }
@keyframes barin { from { transform: scaleX(0); } }

/* ---------- table view ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 11px; background: var(--card); margin-top: 8px; }
table.tbl { width: 100%; border-collapse: collapse; min-width: 900px; }
.tbl th {
  font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); text-align: left; padding: 8px 10px;
  border-bottom: 1px solid var(--border-strong); white-space: nowrap;
}
.tbl td { padding: 5px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.erow { transition: background .1s; }
.tbl tr.erow:hover td { background: var(--row-hover); }
.tbl tr.erow:hover td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.grp td { padding: 7px 10px !important; background: transparent; }
.grp .gl { font: 700 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.grp i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 8px; }
.grp .gn { color: var(--muted); font: 500 10.5px var(--mono); margin-left: 8px; }
.c-dot { width: 34px; }
.c-name { max-width: 300px; }
.c-name a { font-weight: 650; color: var(--fg); text-decoration: none; font-size: 12.5px; vertical-align: middle; margin-left: 8px; }
.c-name a:hover { color: var(--accent); }
.c-note { cursor: help; color: var(--muted); font-size: 10px; margin-left: 6px; border-bottom: 1px dotted var(--muted); vertical-align: middle; }
.c-cat { font-size: 11px; color: var(--muted); white-space: nowrap; }
.c-lic { max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 11px var(--mono); color: var(--muted); }
.c-st { font: 600 11px var(--mono); white-space: nowrap; }
.t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); } .t-mut { color: var(--muted); }
.c-act { text-align: right; white-space: nowrap; width: 62px; }
.act { border: 0; background: transparent; cursor: pointer; font-size: 13px; color: var(--muted); padding: 1px 4px; border-radius: 5px; line-height: 1.4; font-family: inherit; }
.act:hover { color: var(--accent); background: var(--accent-soft); }
.act.on { color: #f59e0b; }

/* ---------- grid view ---------- */
section { margin-top: 20px; }
section h2 { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
section h2 i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
section h2 .cnt { font: 500 10px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; }
section .cd { font-size: 11.5px; color: var(--muted); margin: 1px 0 9px 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 9px; }
.card {
  position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 11px;
  padding: 10px 12px; display: flex; flex-direction: column;
  transition: transform .14s ease, border-color .14s, box-shadow .14s;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.card .name-row { display: flex; align-items: center; gap: 8px; }
.card a.name { color: var(--fg); font-weight: 650; text-decoration: none; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card a.name:hover { color: var(--accent); }
.fav { margin-left: auto; border: 0; background: transparent; cursor: pointer; font-size: 13px; line-height: 1; color: var(--muted); padding: 1px 3px; border-radius: 5px; transition: transform .12s, color .12s; flex: none; }
.fav:hover { transform: scale(1.2); color: #f59e0b; }
.fav.on { color: #f59e0b; }
.card .desc {
  font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .note { font-size: 10.5px; color: var(--muted); font-style: italic; margin-top: 3px; opacity: .85; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.b { font: 600 9.5px var(--mono); border-radius: 5px; padding: 1.5px 6px; white-space: nowrap; border: 1px solid transparent; letter-spacing: .02em; }
.b-ok   { color: var(--ok);   background: color-mix(in srgb, var(--ok) 11%, transparent);   border-color: color-mix(in srgb, var(--ok) 28%, transparent); }
.b-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 11%, transparent); border-color: color-mix(in srgb, var(--warn) 28%, transparent); }
.b-bad  { color: var(--bad);  background: color-mix(in srgb, var(--bad) 11%, transparent);  border-color: color-mix(in srgb, var(--bad) 28%, transparent); }
.b-mut  { color: var(--muted); background: transparent; border-color: var(--border-strong); }
.b-credit { cursor: pointer; }
.b-credit:hover { border-color: var(--accent); color: var(--accent); }
.lic { font: 400 10px var(--mono); color: var(--muted); margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); word-break: break-word; }
mark { background: color-mix(in srgb, var(--accent) 26%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---------- command palette (cmdk-style) ---------- */
.palette { position: fixed; inset: 0; z-index: 100; background: rgba(4,4,10,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-start; }
.palette[hidden] { display: none; }
.pal-panel {
  width: min(620px, 92vw); margin-top: 12vh;
  background: var(--bg); border: 1px solid var(--border-strong); border-radius: 14px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden;
  animation: pop .18s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop { from { transform: scale(.97) translateY(-6px); opacity: 0; } }
#pal-input {
  width: 100%; border: 0; outline: 0; background: transparent; color: var(--fg);
  font-size: 15px; padding: 15px 18px; font-family: inherit;
  border-bottom: 1px solid var(--border);
}
#pal-list { max-height: 400px; overflow-y: auto; padding: 6px; }
.pal-group { font: 600 9.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 9px 12px 4px; }
.pal-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.pal-item.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.pal-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pal-name { font-size: 13px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-meta { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42%; }
.pal-kbd { margin-left: 8px; opacity: 0; font: 500 10px var(--mono); color: var(--muted); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px; flex: none; }
.pal-item.sel .pal-kbd { opacity: 1; }
.pal-empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
.pal-hint { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); letter-spacing: .04em; }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--muted); padding: 60px 0 70px; font-size: 14px; }
.empty .big { font-size: 40px; display: block; margin-bottom: 8px; }
.loading { text-align: center; color: var(--muted); padding: 50px 0; font-size: 12.5px; font-family: var(--mono); }
.loading .spin { display: inline-block; animation: sp 1s linear infinite; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
#to-top {
  position: fixed; right: 22px; bottom: 22px; z-index: 60;
  width: 38px; height: 38px; border-radius: 9px;
  border: 1px solid var(--border-strong); background: var(--card); color: var(--fg);
  font-size: 15px; cursor: pointer; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transform: translateY(8px);
  transition: opacity .2s, transform .2s, border-color .15s;
}
#to-top.show { opacity: 1; pointer-events: auto; transform: none; }
#to-top:hover { border-color: var(--accent); color: var(--accent); }
footer { border-top: 1px solid var(--border); margin-top: 36px; padding: 20px 0 28px; color: var(--muted); font-size: 11px; text-align: center; font-family: var(--mono); }
footer a { color: var(--accent); text-decoration: none; }
footer a:hover { text-decoration: underline; }

@media (max-width: 900px) { .tagline, .stats { display: none; } }
@media (max-width: 760px) {
  /* horizontal pill rails instead of wrapping — saves vertical space */
  .chips, .filters {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; padding-bottom: 2px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  .chips::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
  .chips > *, .filters > * { flex: none; }
  /* real touch targets */
  .chip { padding: 7px 12px; font-size: 12px; }
  .tgl span { padding: 7px 11px; font-size: 11.5px; }
  .sortsel { padding: 7px 9px; font-size: 11.5px; }
  .vbtn { padding: 10px 12px; }
  #search { font-size: 16px; padding: 10px 0; } /* >=16px prevents iOS focus zoom */
  .act { padding: 4px 6px; font-size: 15px; }
  .fav { font-size: 15px; padding: 3px 5px; }
  /* the search box is enough on touch — hide the ⌘K button */
  #pal-open { display: none; }
  /* table fits without horizontal scroll: icon-only status columns */
  .tbl { min-width: 0; }
  .tbl td { padding: 6px; }
  .tbl th { padding: 7px 6px; }
  .c-dot { width: 28px; }
  .c-name { max-width: 44vw; }
  .c-name a { margin-left: 6px; font-size: 12.5px; }
  .c-cat, .c-lic, .c-sig, .tbl th:nth-child(3), .tbl th:nth-child(4), .tbl th:nth-child(7) { display: none; }
  .c-st { font-size: 12.5px; }
  .grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .tb { padding: 10px 14px; gap: 8px; }
  .only-wide { display: none; }
  .wordmark { font-size: 15.5px; }
  #bento { grid-template-columns: repeat(2, 1fr); gap: 7px; }
  .tile { padding: 8px 10px 7px; }
  .tile-n { font-size: 16px; }
  .pal-panel { margin-top: 8vh; }
  #to-top { right: 14px; bottom: 14px; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="gridlines"></div>
  <div class="noise"></div>
</div>

<header class="topbar">
  <div class="wrap tb">
    <div class="tb-left">
      <span class="logo-emoji">🎁</span>
      <div style="min-width:0">
        <div class="wordmark grad">Free for Creators</div>
        <div class="tagline" id="tagline"></div>
      </div>
    </div>
    <div class="tb-right">
      <span class="stats mono" id="stats"></span>
      <a class="ib only-wide" href="https://github.com/skyzhao1223/free-for-creators" target="_blank" rel="noopener">GitHub</a>
      <a class="ib only-wide" href="https://github.com/skyzhao1223/free-for-creators#readme" target="_blank" rel="noopener">README</a>
      <button class="ib" id="lang-btn" type="button" aria-label="Switch language">中文</button>
      <button class="ib" id="theme-btn" type="button" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
</header>

<div id="ctl-sentinel" aria-hidden="true"></div>
<div class="controls-wrap">
  <div class="controls wrap">
    <div class="ctl-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Search resources">
        <kbd class="k-slash">/</kbd>
      </div>
      <button class="ib" id="pal-open" type="button" title="Command palette"><span class="mono">⌘K</span></button>
      <div class="vbtns">
        <button class="vbtn" id="view-table" type="button" title="Table view">☰</button>
        <button class="vbtn" id="view-grid" type="button" title="Grid view">▦</button>
      </div>
    </div>
    <div class="chips" id="chips" aria-label="Categories"></div>
    <div class="filters">
      <label class="tgl"><input type="checkbox" id="f-monetization"><span data-i18n="f_mon"></span></label>
      <label class="tgl"><input type="checkbox" id="f-attribution"><span data-i18n="f_attr"></span></label>
      <label class="tgl"><input type="checkbox" id="f-signup"><span data-i18n="f_signup"></span></label>
      <label class="tgl"><input type="checkbox" id="f-cc0"><span data-i18n="f_cc0"></span></label>
      <select id="sort" class="sortsel" aria-label="Sort order"></select>
      <button id="share" class="chip" type="button"><span data-i18n="share_btn"></span></button>
      <button id="clear" type="button" hidden></button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="bento" aria-label="Category overview"></div>
  <p id="status"></p>
  <div id="results"><div class="loading"><span class="spin">🎁</span><span id="loading-text"></span></div></div>
</main>

<div class="palette" id="palette" hidden>
  <div class="pal-panel" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="pal-input" type="text" autocomplete="off" spellcheck="false">
    <div id="pal-list"></div>
    <div class="pal-hint mono" id="pal-hint"></div>
  </div>
</div>

<button id="to-top" type="button" aria-label="Back to top">↑</button>

<footer><div class="wrap" id="footer-text"></div></footer>

<script>
"use strict";
const REPO = "skyzhao1223/free-for-creators";

const CAT_COLORS = {
  "music": "#e74c8b", "sound-effects": "#f59e0b", "stock-footage": "#8b5cf6",
  "stock-photos": "#3b82f6", "fonts": "#10b981", "graphics-icons": "#14b8a6",
  "video-production": "#ef4444", "mockups-templates": "#eab308",
  "3d-assets": "#6366f1", "search-engines": "#64748b"
};
const DOT_FALLBACK = "#8b93b5";

const I18N = {
  en: {
    tagline: "License-verified free assets for creators — music, footage, photos, fonts, icons, LUTs, mockups, 3D.",
    stat_mono: (n, c) => n + " resources · " + c + " categories · <b>CI-verified weekly</b>",
    search_ph: "Search resources, licenses, notes…",
    all: "All",
    f_mon: "💚 commercial ok",
    f_attr: "➖ no credit",
    f_signup: "🔓 no signup",
    f_cc0: "🆓 cc0 / public domain",
    sort_default: "sort: curated",
    sort_name: "sort: a–z",
    sort_open: "sort: most permissive",
    share_btn: "🔗 share view",
    share_done: "✓ copied",
    share_title: "Copy a link to this filtered view",
    clear: "clear",
    showing: (n, t) => "showing <b>" + n + "</b> / " + t + (n === t ? "" : " (filtered)"),
    bar_title: (a, c, v, n) => "Monetization — allowed: " + a + " · conditional: " + c + " · varies: " + v + " · not allowed: " + n,
    empty: "Nothing matches those filters.",
    empty_hint: "Try clearing a filter or two.",
    empty_btn: "Clear all filters",
    loading: "loading directory…",
    loaderr: "Failed to load data: ",
    footer: 'plain html/css/js · data: <a href="https://github.com/' + REPO + '/tree/main/data">data/*.json</a> (<a href="data/all.json">all.json</a>) · content <a href="https://creativecommons.org/publicdomain/zero/1.0/">cc0</a> · licenses change — verify at source · not legal advice',
    lang_btn: "中文",
    view_table: "Table view",
    view_grid: "Grid view",
    palette_ph: "Search resources and categories…",
    palette_hint: "↑↓ navigate · ↵ open · esc close",
    palette_empty: "No matches",
    pal_jump: "jump to",
    pal_group_cats: "Categories",
    pal_group_res: "Resources",
    th_res: "resource", th_cat: "category", th_license: "license",
    th_attr: "attribution", th_mon: "monetization", th_signup: "acct",
    mon: { allowed: "💚 commercial ok", conditional: "⚠️ conditional", varies: "❓ varies", "not-allowed": "🚫 no commercial" },
    attr: { required: "✅ credit", "not-required": "➖ no credit", varies: "❓ varies" },
    mon_s: { allowed: "commercial ok", conditional: "conditional", varies: "varies", "not-allowed": "no commercial" },
    attr_s: { required: "credit req", "not-required": "no credit", varies: "varies" },
    signup: { required: "🔑 signup" },
    fav_chip: "Favorites",
    fav_on: "Remove from favorites",
    fav_off: "Add to favorites",
    credit_btn: "📋 credit",
    credit_done: "✓",
    credit_title: "Copy an editable credit line for this source",
    credit_tpl: (name, url, license) => '"ASSET NAME" by AUTHOR — via ' + name + " (" + url + ") — License: " + license
  },
  zh: {
    tagline: "许可透明的创作者免费素材目录——音乐、视频、图片、字体、图标、LUT、样机、3D。",
    stat_mono: (n, c) => n + " 资源 · " + c + " 分类 · <b>CI 每周核验</b>",
    search_ph: "搜索资源、许可证、备注…",
    all: "全部",
    f_mon: "💚 可商用",
    f_attr: "➖ 免署名",
    f_signup: "🔓 免注册",
    f_cc0: "🆓 cc0 / 公有领域",
    sort_default: "排序: 默认",
    sort_name: "排序: 名称",
    sort_open: "排序: 最宽松",
    share_btn: "🔗 分享视图",
    share_done: "✓ 已复制",
    share_title: "复制当前筛选视图的链接",
    clear: "清除",
    showing: (n, t) => "显示 <b>" + n + "</b> / " + t + (n === t ? "" : "（已筛选）"),
    bar_title: (a, c, v, n) => "商用性 — 可商用：" + a + " · 有条件：" + c + " · 视情况：" + v + " · 禁止：" + n,
    empty: "没有符合筛选条件的资源。",
    empty_hint: "试着减少一两个筛选条件。",
    empty_btn: "清除全部筛选",
    loading: "正在加载目录…",
    loaderr: "数据加载失败：",
    footer: '纯 html/css/js · 数据源：<a href="https://github.com/' + REPO + '/tree/main/data">data/*.json</a>（<a href="data/all.json">all.json</a>）· 内容 <a href="https://creativecommons.org/publicdomain/zero/1.0/">cc0</a> · 许可会变，发布前请到源站核对 · 不构成法律建议',
    lang_btn: "EN",
    view_table: "表格视图",
    view_grid: "网格视图",
    palette_ph: "搜索资源与分类…",
    palette_hint: "↑↓ 选择 · ↵ 打开 · esc 关闭",
    palette_empty: "无匹配结果",
    pal_jump: "进入",
    pal_group_cats: "分类",
    pal_group_res: "资源",
    th_res: "资源", th_cat: "分类", th_license: "许可",
    th_attr: "署名", th_mon: "商用", th_signup: "注册",
    mon: { allowed: "💚 可商用", conditional: "⚠️ 有条件", varies: "❓ 逐项而定", "not-allowed": "🚫 禁止商用" },
    attr: { required: "✅ 需署名", "not-required": "➖ 免署名", varies: "❓ 逐项而定" },
    mon_s: { allowed: "可商用", conditional: "有条件", varies: "视情况", "not-allowed": "禁商用" },
    attr_s: { required: "需署名", "not-required": "免署名", varies: "视情况" },
    signup: { required: "🔑 注册" },
    fav_chip: "收藏",
    fav_on: "取消收藏",
    fav_off: "收藏",
    credit_btn: "📋 署名",
    credit_done: "✓",
    credit_title: "复制可编辑的署名行（补上作品名与作者）",
    credit_tpl: (name, url, license) => "「作品名」作者：「作者名」— 来自 " + name + "（" + url + "）— 许可：" + license
  }
};

let LANG = "en";
try {
  const savedLang = localStorage.getItem("ffc-lang");
  LANG = savedLang || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
} catch (e) {}

let CATS = [];
let activeSlug = null;
let q = "";
let favOnly = false;
let sortMode = "default";
let viewMode = "table";
try {
  const savedView = localStorage.getItem("ffc-view");
  viewMode = savedView || (window.matchMedia("(max-width: 639px)").matches ? "grid" : "table");
} catch (e) {}
const state = { monetization: false, attribution: false, signup: false, cc0: false };
let FAVS = new Set();
try { FAVS = new Set(JSON.parse(localStorage.getItem("ffc-favs") || "[]")); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("ffc-favs", JSON.stringify([...FAVS])); } catch (e) {} };
let revealed = false;
const mobileMQ = window.matchMedia("(max-width: 760px)");
let MOBILE = mobileMQ.matches;
const MON_ICON = { allowed: "💚", conditional: "⚠️", varies: "❓", "not-allowed": "🚫" };
const ATTR_ICON = { required: "✅", "not-required": "➖", varies: "❓" };
const onMQ = (e) => { MOBILE = e.matches; if (CATS.length) render(); };
if (mobileMQ.addEventListener) mobileMQ.addEventListener("change", onMQ);
else if (mobileMQ.addListener) mobileMQ.addListener(onMQ);

const $ = (id) => document.getElementById(id);
const t = (key) => I18N[LANG][key];
const catColor = (slug) => CAT_COLORS[slug] || DOT_FALLBACK;
const catName = (c) => (LANG === "zh" ? (c.category_zh || c.category) : c.category);
const catDesc = (c) => (LANG === "zh" ? (c.description_zh || c.description) : c.description);
const entryDesc = (e) => (LANG === "zh" && e.description_zh ? e.description_zh : e.description);
const entryNotes = (e) => {
  if (!e.notes) return null;
  return LANG === "zh" && e.notes_zh ? e.notes_zh : e.notes;
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const domainOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };

function logoHtml(e, slug, cls) {
  const dom = domainOf(e.url);
  const letter = esc((e.name.replace(/^The /, "")[0] || "?").toUpperCase());
  return '<span class="logo' + (cls ? " " + cls : "") + '" style="--c:' + catColor(slug) + '">' +
    (dom ? '<img src="https://icons.duckduckgo.com/ip3/' + dom + '.ico" alt="" loading="lazy" onerror="this.remove()">' : "") +
    "<b>" + letter + "</b></span>";
}

/* ---------- shareable hash state ---------- */
function writeHash() {
  const p = [];
  if (q) p.push("q=" + encodeURIComponent(q));
  if (activeSlug) p.push("cat=" + encodeURIComponent(activeSlug));
  if (state.monetization) p.push("mon=1");
  if (state.attribution) p.push("attr=1");
  if (state.signup) p.push("signup=1");
  if (state.cc0) p.push("cc0=1");
  if (favOnly) p.push("fav=1");
  if (sortMode !== "default") p.push("sort=" + encodeURIComponent(sortMode));
  if (viewMode !== "table") p.push("view=" + encodeURIComponent(viewMode));
  const hash = p.length ? "#" + p.join("&") : "";
  history.replaceState(null, "", location.pathname + location.search + hash);
}
function readHash() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return;
  h.split("&").forEach((kv) => {
    const i = kv.indexOf("=");
    if (i === -1) return;
    const k = kv.slice(0, i), v = decodeURIComponent(kv.slice(i + 1));
    if (k === "q") { q = v.toLowerCase(); $("search").value = v; }
    else if (k === "cat") activeSlug = v;
    else if (k === "mon") { state.monetization = v === "1"; $("f-monetization").checked = state.monetization; }
    else if (k === "attr") { state.attribution = v === "1"; $("f-attribution").checked = state.attribution; }
    else if (k === "signup") { state.signup = v === "1"; $("f-signup").checked = state.signup; }
    else if (k === "cc0") { state.cc0 = v === "1"; $("f-cc0").checked = state.cc0; }
    else if (k === "fav") favOnly = v === "1";
    else if (k === "sort") sortMode = ["default", "name", "open"].indexOf(v) !== -1 ? v : "default";
    else if (k === "view") viewMode = v === "grid" ? "grid" : "table";
  });
}

/* ---------- filtering ---------- */
const isCC0 = (e) => /cc0|public domain/i.test(e.license || "");
const openScore = (e) => (e.monetization === "allowed" ? 4 : 0) + (e.attribution === "not-required" ? 2 : 0) + (e.signup === "not-required" ? 1 : 0) + (isCC0(e) ? 3 : 0);
function hl(text) {
  const s = esc(text);
  if (!q || /[^a-z0-9\u4e00-\u9fff .+-]/.test(q)) return s;
  const qe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\s+");
  try { return s.replace(new RegExp("(" + qe + ")", "gi"), "<mark>$1</mark>"); } catch (err) { return s; }
}
function matches(e, c) {
  if (favOnly && !FAVS.has(e.url)) return false;
  if (state.monetization && e.monetization !== "allowed") return false;
  if (state.attribution && e.attribution !== "not-required") return false;
  if (state.signup && e.signup !== "not-required") return false;
  if (state.cc0 && !isCC0(e)) return false;
  if (q) {
    const hay = [e.name, e.license, e.description, e.description_zh || "", e.notes || "", e.notes_zh || "", c ? catName(c) : ""].join(" ").toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}
function applySort(list) {
  if (sortMode === "name") list.sort((a, b) => a.name.localeCompare(b.name));
  else if (sortMode === "open") list.sort((a, b) => openScore(b) - openScore(a) || a.name.localeCompare(b.name));
  return list;
}
const anyFilter = () => q !== "" || activeSlug !== null || favOnly || state.monetization || state.attribution || state.signup || state.cc0;
const monClass = (v) => (v === "allowed" ? "b-ok" : v === "conditional" ? "b-warn" : v === "not-allowed" ? "b-bad" : "b-mut");
const attrClass = (v) => (v === "required" ? "b-warn" : v === "not-required" ? "b-ok" : "b-mut");
const monT = (v) => (v === "allowed" ? "t-ok" : v === "conditional" ? "t-warn" : v === "not-allowed" ? "t-bad" : "t-mut");
const attrT = (v) => (v === "required" ? "t-warn" : v === "not-required" ? "t-ok" : "t-mut");

/* ---------- renderers ---------- */
function actionBtns(e) {
  const isFav = FAVS.has(e.url);
  let h = '<button class="act fav2' + (isFav ? " on" : "") + '" data-url="' + esc(e.url) + '" type="button" aria-pressed="' + isFav + '" title="' + t(isFav ? "fav_on" : "fav_off") + '">' + (isFav ? "★" : "☆") + "</button>";
  if (e.attribution === "required") {
    h += '<button class="act b-credit" data-credit="' + esc(t("credit_tpl")(e.name, e.url, e.license)) + '" type="button" title="' + t("credit_title") + '">📋</button>';
  }
  return h;
}

function renderTable(groups, firstTime) {
  let html = '<div class="tbl-wrap' + (firstTime ? " reveal" : "") + '"><table class="tbl"><thead><tr>' +
    "<th></th><th>" + t("th_res") + '</th><th class="c-cat">' + t("th_cat") + '</th><th class="c-lic">' + t("th_license") + "</th>" +
    "<th>" + t("th_attr") + "</th><th>" + t("th_mon") + '</th><th class="c-sig">' + t("th_signup") + "</th><th></th>" +
    "</tr></thead><tbody>";
  for (const g of groups) {
    html += '<tr class="grp"><td colspan="8"><i style="background:' + catColor(g.c.slug) + '"></i><span class="gl">' + esc(catName(g.c)) + '</span><span class="gn">' + g.list.length + "</span></td></tr>";
    for (const e of g.list) {
      const note = entryNotes(e);
      html += '<tr class="erow">' +
        '<td class="c-dot">' + logoHtml(e, g.c.slug, "logo-sm") + "</td>" +
        '<td class="c-name"><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + hl(e.name) + "</a>" +
        (note ? '<span class="c-note" title="' + esc(note) + '">note</span>' : "") + "</td>" +
        '<td class="c-cat">' + esc(catName(g.c)) + "</td>" +
        '<td class="c-lic" title="' + esc(e.license) + '">' + esc(e.license) + "</td>" +
        '<td class="c-st ' + attrT(e.attribution) + '" title="' + t("attr_s")[e.attribution] + '">' + (MOBILE ? ATTR_ICON[e.attribution] : t("attr_s")[e.attribution]) + "</td>" +
        '<td class="c-st ' + monT(e.monetization) + '" title="' + t("mon_s")[e.monetization] + '">' + (MOBILE ? MON_ICON[e.monetization] : t("mon_s")[e.monetization]) + "</td>" +
        '<td class="c-st c-sig t-mut">' + (e.signup === "required" ? "🔑" : "—") + "</td>" +
        '<td class="c-act">' + actionBtns(e) + "</td>" +
        "</tr>";
    }
  }
  return html + "</tbody></table></div>";
}

function renderGrid(groups, firstTime) {
  let html = "";
  for (const g of groups) {
    html += "<section" + (firstTime ? ' class="reveal"' : "") + "><h2><i style=\"background:" + catColor(g.c.slug) + '"></i>' + esc(catName(g.c)) + '<span class="cnt">' + g.list.length + "</span></h2>" +
      '<div class="cd">' + esc(catDesc(g.c)) + '</div><div class="grid">';
    for (const e of g.list) {
      const note = entryNotes(e);
      const isFav = FAVS.has(e.url);
      html += '<div class="card spot"><div class="name-row">' + logoHtml(e, g.c.slug) +
        '<a class="name" href="' + esc(e.url) + '" target="_blank" rel="noopener">' + hl(e.name) + "</a>" +
        '<button class="fav' + (isFav ? " on" : "") + '" data-url="' + esc(e.url) + '" type="button" aria-pressed="' + isFav + '" title="' + t(isFav ? "fav_on" : "fav_off") + '">' + (isFav ? "★" : "☆") + "</button></div>" +
        '<div class="desc">' + hl(entryDesc(e)) + "</div>" +
        (note ? '<div class="note">' + esc(note) + "</div>" : "") +
        '<div class="badges"><span class="b ' + monClass(e.monetization) + '">' + t("mon")[e.monetization] + "</span>" +
        '<span class="b ' + attrClass(e.attribution) + '">' + t("attr")[e.attribution] + "</span>" +
        (e.signup === "required" ? '<span class="b b-mut">' + t("signup").required + "</span>" : "") +
        (e.attribution === "required" ? '<button type="button" class="b b-mut b-credit" data-credit="' + esc(t("credit_tpl")(e.name, e.url, e.license)) + '" title="' + t("credit_title") + '">' + t("credit_btn") + "</button>" : "") +
        '</div><div class="lic">📄 ' + esc(e.license) + "</div></div>";
    }
    html += "</div></section>";
  }
  return html;
}

function render() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = LANG === "zh" ? "Free for Creators · 创作者免费素材清单" : "Free for Creators — license-verified free assets";
  $("tagline").textContent = t("tagline");
  $("search").placeholder = t("search_ph");
  $("lang-btn").textContent = t("lang_btn");
  $("clear").textContent = t("clear");
  $("share").title = t("share_title");
  $("view-table").title = t("view_table");
  $("view-grid").title = t("view_grid");
  $("pal-input").placeholder = t("palette_ph");
  $("pal-hint").textContent = t("palette_hint");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $("footer-text").innerHTML = t("footer");
  $("theme-btn").textContent = document.documentElement.dataset.theme === "dark" ? "🌙" : "☀️";
  $("view-table").classList.toggle("active", viewMode === "table");
  $("view-grid").classList.toggle("active", viewMode === "grid");

  if (!CATS.length) {
    $("stats").innerHTML = "";
    $("chips").innerHTML = "";
    $("bento").innerHTML = "";
    $("status").innerHTML = "";
    $("results").innerHTML = '<div class="loading"><span class="spin">🎁</span>' + t("loading") + "</div>";
    writeHash();
    return;
  }

  const total = CATS.reduce((n, c) => n + c.entries.length, 0);
  $("stats").innerHTML = t("stat_mono")(total, CATS.length);

  const countFilters = q !== "" || favOnly || state.monetization || state.attribution || state.signup || state.cc0;
  const matchCount = (c) => c.entries.filter((e) => matches(e, c)).length;
  const firstTime = !revealed;

  /* bento category wall */
  $("bento").innerHTML = CATS.map((c) => {
    const mc = countFilters ? matchCount(c) : c.entries.length;
    return '<button class="tile spot' + (activeSlug === c.slug ? " active" : "") + (firstTime ? " reveal" : "") + '" data-slug="' + c.slug + '" type="button" style="--c:' + catColor(c.slug) + '">' +
      '<span class="tile-glow"></span>' +
      '<span class="tile-n">' + (countFilters ? mc + "<small>/" + c.entries.length + "</small>" : mc) + "</span>" +
      '<span class="tile-name">' + esc(catName(c)) + "</span></button>";
  }).join("");

  /* chips (compact sticky nav) */
  let chips = '<button class="chip ' + (favOnly ? "active" : "") + '" data-fav="1" type="button">⭐ ' + t("fav_chip") + '<span class="n">' + FAVS.size + "</span></button>";
  chips += '<button class="chip ' + (activeSlug === null && !favOnly ? "active" : "") + '" data-slug="" type="button">' + t("all") + '<span class="n">' + (countFilters ? CATS.reduce((n, c) => n + matchCount(c), 0) + "/" + total : total) + "</span></button>";
  for (const c of CATS) {
    chips += '<button class="chip ' + (activeSlug === c.slug ? "active" : "") + '" data-slug="' + c.slug + '" type="button">' +
      '<i style="background:' + catColor(c.slug) + '"></i>' + esc(catName(c)) + '<span class="n">' + (countFilters ? matchCount(c) + "/" + c.entries.length : c.entries.length) + "</span></button>";
  }
  $("chips").innerHTML = chips;
  $("clear").hidden = !anyFilter();
  $("sort").innerHTML = ["default", "name", "open"]
    .map((m) => '<option value="' + m + '"' + (m === sortMode ? " selected" : "") + ">" + t("sort_" + m) + "</option>")
    .join("");

  /* groups */
  const groups = [];
  let shown = 0;
  for (const c of CATS) {
    if (activeSlug && c.slug !== activeSlug) continue;
    const list = applySort(c.entries.filter((e) => matches(e, c)));
    if (!list.length) continue;
    shown += list.length;
    groups.push({ c, list });
  }

  /* results */
  $("results").innerHTML = groups.length
    ? (viewMode === "table" ? renderTable(groups, firstTime) : renderGrid(groups, firstTime))
    : '<div class="empty"><span class="big">🤷</span>' + t("empty") + "<br><small>" + t("empty_hint") + '</small><br><br><button class="chip" id="empty-clear" type="button">' + t("empty_btn") + "</button></div>";
  const ec = $("empty-clear");
  if (ec) ec.addEventListener("click", clearAll);

  /* status + monetization data bar */
  const mc = { allowed: 0, conditional: 0, varies: 0, "not-allowed": 0 };
  groups.forEach((g) => g.list.forEach((e) => { mc[e.monetization] = (mc[e.monetization] || 0) + 1; }));
  const seg = (n, col) => (n ? '<i style="flex:' + n + ";background:" + col + '"></i>' : "");
  const bar = groups.length
    ? '<span class="dbar" title="' + esc(t("bar_title")(mc.allowed, mc.conditional, mc.varies, mc["not-allowed"])) + '">' +
      seg(mc.allowed, "var(--ok)") + seg(mc.conditional, "var(--warn)") + seg(mc.varies, "var(--border-strong)") + seg(mc["not-allowed"], "var(--bad)") + "</span>"
    : "";
  $("status").innerHTML = "<span>" + t("showing")(shown, total) + "</span>" + bar;

  if (firstTime) {
    revealed = true;
    observeReveals();
  }
  syncChipsVisibility();
  writeHash();
}

function observeReveals() {
  const els = document.querySelectorAll(".reveal:not(.in)");
  if (!("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.05 });
  els.forEach((el) => io.observe(el));
}

function clearAll() {
  q = ""; $("search").value = "";
  activeSlug = null;
  favOnly = false;
  sortMode = "default";
  state.monetization = state.attribution = state.signup = state.cc0 = false;
  $("f-monetization").checked = $("f-attribution").checked = $("f-signup").checked = $("f-cc0").checked = false;
  render();
}

/* ---------- command palette ---------- */
let paletteItems = [], paletteIdx = 0;
function flatEntries() {
  const out = [];
  for (const c of CATS) for (const e of c.entries) out.push({ e, c });
  return out;
}
function buildPalette(query) {
  const qq = query.trim().toLowerCase();
  const items = [];
  for (const c of CATS) {
    if (!qq || (catName(c) + " " + c.category).toLowerCase().indexOf(qq) !== -1) items.push({ type: "cat", c });
  }
  for (const it of flatEntries()) {
    if (items.length > 40) break;
    const hay = (it.e.name + " " + it.e.license + " " + it.e.description + " " + (it.e.description_zh || "") + " " + catName(it.c)).toLowerCase();
    if (!qq || hay.indexOf(qq) !== -1) items.push({ type: "res", e: it.e, c: it.c });
  }
  paletteItems = items.slice(0, 9);
  paletteIdx = 0;
  renderPalette();
}
function renderPalette() {
  let html = "", lastType = null;
  paletteItems.forEach((it, i) => {
    if (it.type !== lastType) {
      lastType = it.type;
      html += '<div class="pal-group">' + (it.type === "cat" ? t("pal_group_cats") : t("pal_group_res")) + "</div>";
    }
    const sel = i === paletteIdx ? " sel" : "";
    if (it.type === "cat") {
      html += '<div class="pal-item' + sel + '" data-i="' + i + '"><span class="pal-dot" style="background:' + catColor(it.c.slug) + '"></span>' +
        '<span class="pal-name">' + esc(catName(it.c)) + '</span><span class="pal-meta mono">' + t("pal_jump") + " · " + it.c.entries.length + '</span><kbd class="pal-kbd">↵</kbd></div>';
    } else {
      html += '<div class="pal-item' + sel + '" data-i="' + i + '">' + logoHtml(it.e, it.c.slug, "logo-sm") +
        '<span class="pal-name">' + esc(it.e.name) + '</span><span class="pal-meta mono">' + esc(it.e.license) + '</span><kbd class="pal-kbd">↵</kbd></div>';
    }
  });
  $("pal-list").innerHTML = html || '<div class="pal-empty">' + t("palette_empty") + "</div>";
}
function openPalette() {
  $("palette").hidden = false;
  $("pal-input").value = "";
  buildPalette("");
  $("pal-input").focus();
  document.body.style.overflow = "hidden";
}
function closePalette() {
  $("palette").hidden = true;
  document.body.style.overflow = "";
}
function activatePalette(i) {
  const it = paletteItems[i];
  if (!it) return;
  closePalette();
  if (it.type === "cat") {
    activeSlug = it.c.slug;
    favOnly = false;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    window.open(it.e.url, "_blank", "noopener");
  }
}

/* ---------- chips/bento scroll handoff: never show category tags twice ---------- */
const syncChipsVisibility = () => {
  if (!CATS.length) return;
  const gone = $("bento").getBoundingClientRect().bottom <= 120;
  $("chips").classList.toggle("chips-hidden", !gone);
};

/* ---------- events ---------- */
let searchTimer = null;
$("search").addEventListener("input", (e) => {
  const v = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { q = v.trim().toLowerCase(); render(); }, 150);
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  if (b.dataset.fav) { favOnly = !favOnly; render(); return; }
  activeSlug = b.dataset.slug || null;
  render();
});
$("bento").addEventListener("click", (e) => {
  const b = e.target.closest(".tile");
  if (!b) return;
  const s = b.dataset.slug;
  activeSlug = activeSlug === s ? null : s;
  render();
});
[["f-monetization", "monetization"], ["f-attribution", "attribution"], ["f-signup", "signup"], ["f-cc0", "cc0"]].forEach(([id, key]) => {
  $(id).addEventListener("change", (e) => { state[key] = e.target.checked; render(); });
});
$("sort").addEventListener("change", (e) => { sortMode = e.target.value; render(); });
$("share").addEventListener("click", () => {
  const url = location.href;
  const span = $("share").querySelector("span");
  const done = () => { span.textContent = t("share_done"); setTimeout(() => { span.textContent = t("share_btn"); }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => window.prompt("URL:", url));
  else window.prompt("URL:", url);
});
const setView = (v) => {
  viewMode = v;
  try { localStorage.setItem("ffc-view", v); } catch (e) {}
  render();
};
$("view-table").addEventListener("click", () => setView("table"));
$("view-grid").addEventListener("click", () => setView("grid"));
$("results").addEventListener("click", (e) => {
  const credit = e.target.closest(".b-credit");
  if (credit) {
    const text = credit.dataset.credit;
    const done = () => {
      const old = credit.textContent;
      credit.textContent = t("credit_done");
      setTimeout(() => { credit.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => window.prompt("Copy:", text));
    else window.prompt("Copy:", text);
    return;
  }
  const fav = e.target.closest(".fav, .fav2");
  if (!fav) return;
  const url = fav.dataset.url;
  if (FAVS.has(url)) FAVS.delete(url); else FAVS.add(url);
  saveFavs();
  render();
});
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest(".spot");
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", (e.clientX - r.left) + "px");
  el.style.setProperty("--my", (e.clientY - r.top) + "px");
}, { passive: true });
$("lang-btn").addEventListener("click", () => {
  LANG = LANG === "en" ? "zh" : "en";
  try { localStorage.setItem("ffc-lang", LANG); } catch (e) {}
  render();
  if (!$("palette").hidden) buildPalette($("pal-input").value);
});
$("theme-btn").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ffc-theme", next); } catch (e) {}
  render();
});
$("pal-open").addEventListener("click", openPalette);
$("palette").addEventListener("click", (e) => { if (e.target === $("palette")) closePalette(); });
$("pal-input").addEventListener("input", (e) => buildPalette(e.target.value));
$("pal-input").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); paletteIdx = Math.min(paletteIdx + 1, paletteItems.length - 1); renderPalette(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); paletteIdx = Math.max(paletteIdx - 1, 0); renderPalette(); }
  else if (e.key === "Enter") { e.preventDefault(); activatePalette(paletteIdx); }
  else if (e.key === "Escape") { closePalette(); }
});
$("pal-list").addEventListener("click", (e) => {
  const item = e.target.closest(".pal-item");
  if (item) activatePalette(parseInt(item.dataset.i, 10));
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if ($("palette").hidden) openPalette(); else closePalette();
    return;
  }
  if (e.key === "/" && $("palette").hidden && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    e.preventDefault();
    $("search").focus();
  } else if (e.key === "Escape" && document.activeElement === $("search")) {
    $("search").blur();
  }
});
const toTop = $("to-top");
window.addEventListener("scroll", () => {
  toTop.classList.toggle("show", window.scrollY > 500);
}, { passive: true });
window.addEventListener("scroll", syncChipsVisibility, { passive: true });
window.addEventListener("resize", syncChipsVisibility);
/* sticky bar: transparent at rest (blends into the ambient background),
   frosted glass only once it actually sticks — scroll-listener based so it
   works in every environment (IO callbacks can be frame-starved) */
const ctlWrap = document.querySelector(".controls-wrap");
const syncStuck = () => {
  ctlWrap.classList.toggle("stuck", document.getElementById("ctl-sentinel").getBoundingClientRect().bottom < 1);
};
window.addEventListener("scroll", syncStuck, { passive: true });
window.addEventListener("resize", syncStuck);
syncStuck();
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
window.addEventListener("hashchange", () => { readHash(); render(); });

/* ---------- boot ---------- */
readHash();
render();
const loadFail = (err) => {
  $("results").innerHTML = '<div class="empty"><span class="big">⚠️</span>' + t("loaderr") + esc(err) + "</div>";
  $("status").textContent = "";
};
fetch("data/all.json")
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => { CATS = d.categories; render(); })
  .catch(() => fetch("data/manifest.json")
    .then((r) => { if (!r.ok) throw new Error("manifest " + r.status); return r.json(); })
    .then((manifest) => Promise.all(manifest.map((m) => fetch("data/" + m.slug + ".json").then((r) => { if (!r.ok) throw new Error(m.slug + " " + r.status); return r.json(); }))))
    .then((cats) => { CATS = cats; render(); })
    .catch(loadFail));
</script>
</body>
</html>
