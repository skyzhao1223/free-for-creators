name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — build_site.py derives sitemap.xml's <lastmod> from the last
      # commit that touched data/. A shallow clone grafts HEAD as a root commit and
      # reports HEAD's date instead; full history keeps that value honest and quiet.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate data files
        run: python scripts/build_readme.py --validate-only
      - name: Check README is in sync with data/
        run: python scripts/build_readme.py --check
      # site/all.html, site/sitemap.xml and site/data/ are all deploy-time artifacts
      # (gitignored), so there is nothing to sync-check here. Building them into a
      # throwaway directory proves the Pages payload still assembles, and fails if
      # site/index.html's CAT_COLORS drifts from CATEGORY_ORDER.
      - name: Build site payload
        run: python scripts/build_site.py --out "${{ runner.temp }}/site-data"

  # The repo description shows up in GitHub search, topic pages and link previews, and it
  # carries the entry count — so it drifts every time data/ grows (it once advertised 158
  # while the READMEs said 172). Regenerate it from the same source of truth as the
  # READMEs and PATCH it back when it differs. Push-to-main only: fork PRs get a read-only
  # token by design, and a PR should not be able to rewrite repo metadata.
  #
  # PATCHing repo metadata is NOT something GITHUB_TOKEN can do (workflow permissions
  # have no 'administration' key). Add a secret REPO_ADMIN_PAT — a fine-grained PAT with
  # Administration: read and write on this repo only — to automate the update.
  #
  # Without that secret the drift is *detected but not fatal*: it is reported as a
  # warning and the job exits 0. That is deliberate, and it differs from the README sync
  # check on purpose. A contributor can always satisfy the README check by running the
  # generator and committing, but nobody can satisfy a metadata PATCH from inside a
  # workflow — so failing there would red every data push with no in-repo fix available.
  # A configured-but-failing PAT *is* fatal, because that one is actionable.
  #
  # Annotation text below is kept free of $(...) and variable interpolation on purpose:
  # an earlier version nested a quoted command substitution inside the message, the
  # inner quote closed the string early, and bash died with "syntax error near
  # unexpected token `('" — so the job reported a syntax error instead of the drift it
  # had just correctly detected.
  sync-description:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync repo description with data/
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT || github.token }}
          HAS_PAT: ${{ secrets.REPO_ADMIN_PAT && 'yes' || '' }}
        run: |
          set -euo pipefail
          want="$(python3 scripts/build_readme.py --description)"
          have="$(gh repo view "$GITHUB_REPOSITORY" --json description --jq .description)"
          if [ "$want" = "$have" ]; then
            echo "Description already in sync."
            exit 0
          fi
          echo "Description drifted:"
          echo "  live:   $have"
          echo "  data/:  $want"
          if [ -z "$HAS_PAT" ]; then
            echo "::warning title=Repo description is stale::No REPO_ADMIN_PAT secret is configured and GITHUB_TOKEN cannot PATCH repo metadata. Fix it once locally: run python3 scripts/build_readme.py --description, then gh repo edit --description with that text. Or add a fine-grained PAT secret (Administration read+write, this repo only) to automate it."
            exit 0
          fi
          if gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f description="$want" >/dev/null 2>&1; then
            echo "Description updated via REPO_ADMIN_PAT."
          else
            echo "::error title=Repo description PATCH failed::REPO_ADMIN_PAT is set but the metadata PATCH was rejected. Check that it is a fine-grained PAT with Administration read and write on this repo and that it has not expired. Manual fix: run python3 scripts/build_readme.py --description, then gh repo edit --description with that text."
            exit 1
          fi
