name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data files
        run: python scripts/build_readme.py --validate-only
      - name: Check README is in sync with data/
        run: python scripts/build_readme.py --check
