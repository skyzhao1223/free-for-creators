name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dispatchable so experiences.yml can put a CI run on the pull request it opens: events
  # caused by GITHUB_TOKEN do not start workflows, but an explicit dispatch is allowed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — build_site.py derives sitemap.xml's <lastmod> from the last
      # commit that touched data/. A shallow clone grafts HEAD as a root commit and
      # reports HEAD's date instead; full history keeps that value honest and quiet.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # First, and separately from the checks below: the rules those checks enforce are
      # regex and cross-field logic, and a widened pattern or a dropped coherence rule
      # changes what CI accepts without changing any output a reviewer would look at.
      # tests/test_pr_contract.py also re-reads .github/PULL_REQUEST_TEMPLATE.md, so a
      # rewording of the template fails here before pr-contract.yml rejects contributors.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t .
      - name: Validate data files
        run: python scripts/build_readme.py --validate-only
      # Field notes are a second store, deliberately outside data/*.json, so the category
      # validation above never sees them. This proves every published note still anchors to
      # an entry that exists, carries a thread in this repo, and reads like a story — and
      # that the collector's ignore list is still a list of github threads with reasons.
      - name: Validate field notes
        run: |
          python scripts/experiences.py --check
          python scripts/sync_experiences.py --check
      # contributors.json is written by the Credit contributors workflow, but it is committed
      # and the READMEs quote it, so a hand edit has to be as valid as a generated one.
      - name: Validate the credits file
        run: python scripts/sync_contributors.py --check
      # The schema proves an entry is well-formed; this proves it is well-written and
      # internally coherent — no unverifiable quantity claims, no empty superlatives, no
      # "conditional" monetization with nothing recording the condition, no duplicate or
      # tracked URL. Offline on purpose: the live link check is linkcheck.yml's job, and
      # repeating 200 requests here would only make this workflow slow.
      - name: Audit entry quality
        run: python scripts/check_entry.py --all --offline
      - name: Check README is in sync with data/
        run: python scripts/build_readme.py --check
      # site/all.html, site/sitemap.xml and site/data/ are all deploy-time artifacts
      # (gitignored), so there is nothing to sync-check here. Building them into a
      # throwaway directory proves the Pages payload still assembles, and fails if
      # site/index.html's CAT_COLORS drifts from CATEGORY_ORDER.
      - name: Build site payload
        run: python scripts/build_site.py --out "${{ runner.temp }}/site-data"

  # Nothing in the build can see this class of bug, and the diff cannot either: a static
  # page is only wrong at a width nobody happened to open. Two shipped. site/all.html's
  # tables cannot shrink below their ~520-630px min-content and nothing scrolled them, so a
  # 320px phone got a 649px document — 329px of sideways scroll on every table. And
  # site/index.html's table kept `min-width: 900px` because the intended override was
  # written as `.tbl` and lost the specificity fight with the base rule `table.tbl`,
  # leaving a 768px iPad 98px wide of its own viewport — in the view that page *defaults*
  # to at that width. So drive the real pages in headless Chrome and fail on any width
  # where the document itself can scroll sideways.
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Build into site/ itself, the way pages.yml does — not into a throwaway directory.
      # The interactive page fetches site/data/all.json, and a missing payload renders an
      # empty state, which cannot overflow: this check would then pass exactly when the
      # payload was broken. check_responsive.py also refuses to run without it.
      - name: Build the site payload
        run: python3 scripts/build_site.py
      - name: Locate a Chrome binary
        id: chrome
        run: |
          set -euo pipefail
          # Same probe as banner.yml: ubuntu-latest ships Google Chrome preinstalled, and
          # this repo adds no third-party setup action where it can avoid one.
          found=""
          for c in google-chrome google-chrome-stable chromium-browser chromium chrome; do
            if command -v "$c" >/dev/null 2>&1; then found="$(command -v "$c")"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::No Chrome/Chromium binary found on this runner."
            exit 1
          fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "Chrome: $found"
          "$found" --version
      - name: Check no page scrolls sideways at any supported width
        run: python3 scripts/check_responsive.py --chrome "${{ steps.chrome.outputs.path }}"

  # The description carries the entry count, so it drifts every time data/ grows (it once
  # advertised 158 while the READMEs said 172). Regenerate it from the same source of truth
  # and PATCH it back. Push-to-main only: fork PRs get a read-only token, and a PR should not
  # be able to rewrite repo metadata.
  #
  # GITHUB_TOKEN cannot PATCH metadata (workflow permissions have no 'administration' key),
  # so this needs a REPO_ADMIN_PAT secret: fine-grained, Administration read+write, this repo
  # only. Without one the drift is a warning rather than a failure, because no contributor can
  # fix it from inside the repo — unlike the README sync check. A PAT that is present but
  # rejected is fatal, since that one is actionable.
  sync-description:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync repo description with data/
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT || github.token }}
          HAS_PAT: ${{ secrets.REPO_ADMIN_PAT && 'yes' || '' }}
        run: |
          set -euo pipefail
          want="$(python3 scripts/build_readme.py --description)"
          have="$(gh repo view "$GITHUB_REPOSITORY" --json description --jq .description)"
          if [ "$want" = "$have" ]; then
            echo "Description already in sync."
            exit 0
          fi
          echo "Description drifted:"
          echo "  live:   $have"
          echo "  data/:  $want"
          if [ -z "$HAS_PAT" ]; then
            echo "::warning title=Repo description is stale::No REPO_ADMIN_PAT secret is configured and GITHUB_TOKEN cannot PATCH repo metadata. Fix it once locally: run python3 scripts/build_readme.py --description, then gh repo edit --description with that text. Or add a fine-grained PAT secret (Administration read+write, this repo only) to automate it."
            exit 0
          fi
          if gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f description="$want" >/dev/null 2>&1; then
            echo "Description updated via REPO_ADMIN_PAT."
          else
            echo "::error title=Repo description PATCH failed::REPO_ADMIN_PAT is set but the metadata PATCH was rejected. Check that it is a fine-grained PAT with Administration read and write on this repo and that it has not expired. Manual fix: run python3 scripts/build_readme.py --description, then gh repo edit --description with that text."
            exit 1
          fi
