name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — build_site.py derives sitemap.xml's <lastmod> from the last
      # commit that touched data/. A shallow clone grafts HEAD as a root commit and
      # reports HEAD's date instead; full history keeps that value honest and quiet.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate data files
        run: python scripts/build_readme.py --validate-only
      - name: Check README is in sync with data/
        run: python scripts/build_readme.py --check
      # site/all.html, site/sitemap.xml and site/data/ are all deploy-time artifacts
      # (gitignored), so there is nothing to sync-check here. Building them into a
      # throwaway directory proves the Pages payload still assembles, and fails if
      # site/index.html's CAT_COLORS drifts from CATEGORY_ORDER.
      - name: Build site payload
        run: python scripts/build_site.py --out "${{ runner.temp }}/site-data"

  # The repo description shows up in GitHub search, topic pages and link previews, and it
  # carries the entry count — so it drifts every time data/ grows (it once advertised 158
  # while the READMEs said 172). Regenerate it from the same source of truth as the
  # READMEs and PATCH it back when it differs. Push-to-main only: fork PRs get a read-only
  # token by design, and a PR should not be able to rewrite repo metadata.
  #
  # PATCHing repo metadata is NOT something GITHUB_TOKEN can do (workflow permissions
  # have no 'administration' key). Add a secret REPO_ADMIN_PAT — a fine-grained PAT with
  # Administration: read and write on this repo only — to automate the update. Without
  # it the job still detects drift and fails with the one-line manual fix, the same
  # fail-loudly style as the README sync check.
  sync-description:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync repo description with data/
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_PAT || github.token }}
        run: |
          set -euo pipefail
          want="$(python3 scripts/build_readme.py --description)"
          have="$(gh repo view "$GITHUB_REPOSITORY" --json description --jq .description)"
          if [ "$want" = "$have" ]; then
            echo "Description already in sync."
            exit 0
          fi
          echo "Description drifted:"
          echo "  live: $have"
          echo "  data/: $want"
          if gh api -X PATCH "repos/$GITHUB_REPOSITORY" -f description="$want" >/dev/null 2>&1; then
            echo "Description updated via REPO_ADMIN_PAT."
          else
            echo "::error::Repo description is stale and this token cannot PATCH repo metadata. Run locally: gh repo edit --description "\$(python3 scripts/build_readme.py --description)" — or add a REPO_ADMIN_PAT secret (fine-grained PAT, Administration read+write, this repo only) to automate it."
            exit 1
          fi
