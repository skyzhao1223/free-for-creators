name: Link check

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check all resource links
        env:
          LINKCHECK_REPORT: ${{ runner.temp }}/linkcheck-report.md
        run: python scripts/linkcheck.py
      - name: Hint on failure
        if: failure()
        run: |
          echo "Broken links were found. See the job summary above, then either:"
          echo "  - update/replace the URL in data/*.json, or"
          echo "  - remove the entry if the service is gone, or"
          echo "  - add \"skip_linkcheck\": true with justification (login walls etc)."
      - name: Open or update tracking issue
        if: failure()
        uses: actions/github-script@v9
        env:
          LINKCHECK_REPORT: ${{ runner.temp }}/linkcheck-report.md
        with:
          script: |
            const fs = require("fs");
            const p = process.env.LINKCHECK_REPORT;
            const report = (p && fs.existsSync(p)) ? fs.readFileSync(p, "utf8") : "_Report unavailable — see workflow logs._";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "link-check", per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open[0].number,
                body: `Still failing as of ${new Date().toISOString()}.\n\n${report}\n\nRun: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: "🔗 Link check found broken links",
                body: `The scheduled link check failed.\n\n${report}\n\nRun: ${runUrl}`,
                labels: ["link-check"],
              });
            }
