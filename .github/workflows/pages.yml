name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data
        run: python3 scripts/build_readme.py --validate-only
      - name: Assemble site artifact
        run: |
          mkdir -p site/data
          cp data/*.json site/data/
          python3 -c "import json,sys; sys.path.insert(0,'scripts'); from build_readme import CATEGORY_ORDER; json.dump([{'slug': s} for s in CATEGORY_ORDER], open('site/data/manifest.json','w'))"
          python3 -c "import json,sys; sys.path.insert(0,'scripts'); from build_readme import CATEGORY_ORDER; cats=[json.load(open(f'data/{s}.json')) for s in CATEGORY_ORDER]; json.dump({'total': sum(len(c['entries']) for c in cats), 'categories': cats}, open('site/data/all.json','w'), ensure_ascii=False)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
